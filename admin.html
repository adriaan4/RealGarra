<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Real Garra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>⚙️ Panel de Control Administrador</h2>
    </header>

    <main>
        <section id="admin-porra" class="card">
            <h2>🦁 ADMIN PORRA</h2>
            
            <h3>⚽ Porras de Partidos Registradas</h3>
            <table class="tabla-admin" id="tabla-admin-porras-partidos">
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Jornada</th>
                        <th>Partido</th>
                        <th>Predicción</th>
                        <th>Resultado Real</th>
                        <th>Puntos</th>
                    </tr>
                </thead>
                <tbody id="tbody-porras-partidos"></tbody>
            </table>

            <br><hr><br>

            <h3>🏆 Porras Finales de Temporada Registradas</h3>
            <table class="tabla-admin" id="tabla-admin-porras-finales">
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Goleador</th>
                        <th>Posición</th>
                        <th>Goles Antonio</th>
                        <th>Asistente</th>
                        <th>Amarillas</th>
                        <th>MVP</th>
                    </tr>
                </thead>
                <tbody id="tbody-porras-finales"></tbody>
            </table>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/admin/porras/partidos')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('tbody-porras-partidos');
                    tbody.innerHTML = '';
                    data.forEach(p => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${p.usuario}</td>
                                <td>${p.jornada}</td>
                                <td>${p.partidoTexto}</td>
                                <td>${p.golesLocal} - ${p.golesVisitante}</td>
                                <td>${p.resultadoReal}</td>
                                <td>${p.puntos}</td>
                            </tr>
                        `;
                    });
                });

            fetch('/api/admin/porras/finales')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('tbody-porras-finales');
                    tbody.innerHTML = '';
                    data.forEach(pf => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${pf.usuario}</td>
                                <td>${pf.goleador}</td>
                                <td>${pf.posicion}º</td>
                                <td>${pf.golesAntonio}</td>
                                <td>${pf.asistente}</td>
                                <td>${pf.amarillas}</td>
                                <td>${pf.mvp}</td>
                            </tr>
                        `;
                    });
                });
        });
    </script>
</body>
</html>
