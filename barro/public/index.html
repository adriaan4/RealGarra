<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DEL BARRO AL GARRO</title>
<style>
:root{--bg:#0a0e14;--pn:#131a24;--pn2:#1a2330;--ac:#00e08a;--ac2:#18b7ff;--tx:#e8eef5;--mu:#7f8ea3;--rd:#ff4d6a;--gd:#f5c542}
*{box-sizing:border-box;margin:0}body{background:radial-gradient(1200px 600px at 70% -10%,#0f2a30,transparent),var(--bg);color:var(--tx);font:14px system-ui,Segoe UI,sans-serif;padding-bottom:70px;min-height:100vh}
h1,h2,h3{font-family:Impact,'Arial Narrow',sans-serif;letter-spacing:.04em;text-transform:uppercase}h2{font-size:22px;margin:4px 0 12px}h3{font-size:15px;color:var(--ac);margin-bottom:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:#0b1118ee;backdrop-filter:blur(8px);display:flex;overflow-x:auto;border-top:1px solid #243245;z-index:9;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1 0 auto;background:none;border:0;color:var(--mu);padding:10px 12px;font:600 11px system-ui;text-transform:uppercase;border-top:3px solid transparent}nav button.on{color:var(--ac);border-color:var(--ac)}
@media(min-width:900px){body{padding:0 0 0 190px}nav{top:0;right:auto;width:190px;flex-direction:column;border:0;border-right:1px solid #243245;overflow:visible}nav button{text-align:left;padding:14px 18px;border-top:0;border-left:3px solid transparent;font-size:12px}nav button.on{border-left-color:var(--ac)}}
main{max-width:1100px;margin:auto;padding:14px;animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.g{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g4{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.c{background:linear-gradient(160deg,var(--pn2),var(--pn));border:1px solid #243245;border-radius:14px;padding:14px}.r{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.mu{color:var(--mu)}.sm{font-size:12px}
.btn{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#021;border:0;border-radius:10px;padding:10px 16px;font:800 13px system-ui;text-transform:uppercase;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}.btn.s{background:var(--pn2);color:var(--tx);border:1px solid #2c3b50}.btn.big{font-size:17px;padding:16px;width:100%}.btn:disabled{opacity:.4}
input,select{background:#0d131b;color:var(--tx);border:1px solid #2c3b50;border-radius:8px;padding:8px;font:inherit;max-width:100%}
table{width:100%;border-collapse:collapse}td,th{padding:7px 5px;text-align:center;border-bottom:1px solid #1e2a3a}td:nth-child(2),th:nth-child(2){text-align:left}th{color:var(--mu);font-size:11px}tr.me td{background:#00e08a18;font-weight:700}tr.up td:first-child{box-shadow:inset 3px 0 var(--ac)}tr.dn td:first-child{box-shadow:inset 3px 0 var(--rd)}
.pc{position:relative;border-radius:14px 14px 22px 22px;padding:10px;background:linear-gradient(160deg,#a0683a,#5c3a1e);cursor:pointer;border:2px solid transparent;transition:.15s;user-select:none}.pc.pl{background:linear-gradient(160deg,#c9d3de,#6b7b8d);color:#101820}.pc.go{background:linear-gradient(160deg,#f7d56a,#a8801d);color:#241a00}.pc.sp{background:linear-gradient(160deg,#18e0c0,#1a4cc7)}
.pc.sel{border-color:#fff;transform:scale(1.04)}.pc .o{font:900 30px Impact}.pc .nm{font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc .a{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;font-size:11px;margin-top:6px}.pc .a b{opacity:.75;font-weight:600}
.bar{height:5px;background:#0006;border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}.bd{font-size:10px;background:var(--rd);color:#fff;border-radius:6px;padding:1px 5px}
.pitch{position:relative;aspect-ratio:3/4;max-width:460px;margin:auto;background:repeating-linear-gradient(#1c7a3e 0 12.5%,#1f8a45 12.5% 25%);border:3px solid #fff8;border-radius:12px;overflow:hidden}.pitch:before{content:'';position:absolute;left:0;right:0;top:50%;border-top:2px solid #fff6}
.sl{position:absolute;transform:translate(-50%,-50%);width:74px;text-align:center;font-size:11px;font-weight:700;cursor:pointer}.sl .d{width:46px;height:46px;border-radius:50%;margin:auto;display:grid;place-items:center;font:900 16px Impact;background:#0d131b;border:3px solid var(--ac);color:#fff}.sl.sel .d{border-color:#fff;box-shadow:0 0 14px #fff}.sl small{display:block;background:#000a;border-radius:6px;padding:1px 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:20;padding:12px;animation:in .2s}.modal>div{background:var(--pn);border:1px solid #2c3b50;border-radius:16px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.score{font:900 54px Impact;text-align:center}.st{display:grid;grid-template-columns:1fr 2fr 1fr;text-align:center;padding:4px 0;border-bottom:1px solid #1e2a3a}.chip{display:inline-block;padding:2px 8px;border-radius:99px;background:#243245;font-size:11px;margin:2px}
.nw{padding:8px 0;border-bottom:1px solid #1e2a3a}.W{color:var(--ac)}.L{color:var(--rd)}.D{color:var(--gd)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tabs button{white-space:nowrap}
.ldw{min-height:100vh;display:grid;place-content:center;gap:16px;text-align:center;padding:20px}.ldt{font:900 clamp(28px,8vw,46px) Impact;letter-spacing:.04em;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}.ldb{width:min(320px,80vw);height:8px;background:#243245;border-radius:6px;overflow:hidden;margin:auto}.ldb i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:6px;animation:ldm 1.1s infinite ease-in-out}@keyframes ldm{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

body{background:radial-gradient(900px 500px at 85% -10%,#0d3b3f,transparent),radial-gradient(700px 500px at -10% 40%,#13213f,transparent),linear-gradient(#070b11,#0a0e14) fixed}
.hd{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:14px;border-radius:16px;background:linear-gradient(100deg,#0e3a3a,#142033 60%,#0d1520);border:1px solid #2a4a55;box-shadow:0 8px 30px #0008}.hd b{font:900 20px Impact;letter-spacing:.05em}.hd .mu{font-size:11px}.hd .bu{margin-left:auto;text-align:right;font:900 18px Impact;color:var(--gd)}
.c{box-shadow:0 6px 22px #0006;backdrop-filter:blur(4px)}.c h3{border-left:3px solid var(--ac);padding-left:8px}
.pc{overflow:hidden;box-shadow:0 8px 18px #0008}.pc:hover{transform:translateY(-4px) rotate(-.4deg)}.pc:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 38%,#fff4 50%,transparent 62%);background-size:260% 100%;animation:shn 5s infinite}@keyframes shn{0%{background-position:160% 0}60%,100%{background-position:-60% 0}}
.fld{position:relative;aspect-ratio:16/10;background:repeating-linear-gradient(90deg,#1c7a3e 0 10%,#1f8a45 10% 20%);border:3px solid #fff8;border-radius:10px;overflow:hidden;margin-top:10px}.fld:before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #fff6}.fld:after{content:'';position:absolute;left:50%;top:50%;width:16%;aspect-ratio:1;border:2px solid #fff6;border-radius:50%;transform:translate(-50%,-50%)}
.ch{position:absolute;width:7%;aspect-ratio:1;min-width:22px;border-radius:50%;border:2px solid;display:grid;place-items:center;font:900 12px Impact;transform:translate(-50%,-50%);transition:left .8s ease,top .8s ease;box-shadow:0 3px 5px #000a;z-index:2}.bl{position:absolute;width:3.4%;min-width:10px;aspect-ratio:1;background:#fff;border-radius:50%;transform:translate(-50%,-50%);transition:left .45s ease,top .45s ease;left:50%;top:50%;box-shadow:0 0 8px #fff;z-index:3}
.fxo{position:absolute;inset:0;display:grid;place-items:center;font:900 clamp(30px,9vw,60px) Impact;color:#fff;text-shadow:0 0 24px #00e08a;opacity:0;pointer-events:none;z-index:4}.fxo.on{animation:gol 1.3s}@keyframes gol{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1)}}
.modal.w>div{max-width:780px}
</style></head><body><div id="app"><div class="ldw"><div class="ldt">DEL BARRO AL GARRO</div><div class="ldb"><i></i></div><div class="mu sm">Entrando al modo carrera…</div></div></div>
<script>
const LD=m=>`<div class="ldw"><div class="ldt">DEL BARRO AL GARRO</div><div class="ldb"><i></i></div><div class="mu sm">${m}</div></div>`,fail=()=>{$('#app').innerHTML=`<div class="ldw"><div class="ldt">DEL BARRO AL GARRO</div><div class="mu">No se pudo conectar con el servidor.</div><button class="btn" style="margin:auto" onclick="location.reload()">Reintentar</button></div>`};
const $=s=>document.querySelector(s);let G,ID=localStorage.dbag,TAB='inicio',SEL=null,DIV=null,MKQ={q:'',pos:'',max:''},TR=null;
const T=['inicio:Inicio','plantilla:Plantilla','tacticas:Tácticas','mercado:Mercado','calendario:Calendario','clasificacion:Clasificación','estadisticas:Estadísticas','entrenamiento:Entreno','finanzas:Finanzas','historial:Historial','ajustes:Ajustes'];
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>(n<0?'−':'')+Math.abs(n).toLocaleString('es-ES')+' €',dt=d=>new Date(d).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'});
let DEV='',ME=null;try{DEV=localStorage.dev||(localStorage.dev=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)))}catch{DEV=Math.random().toString(36).slice(2)}
const api=async(u,b,m)=>{const r=await fetch('api/'+u,{method:m||(b?'POST':'GET'),headers:{'content-type':'application/json','x-device':DEV},body:b?JSON.stringify(b):undefined});return r.json()};
const act=async(b)=>{const r=await api('act?id='+ID,b);if(r.err){toast(r.err);return r}if(r.g)G=r.g;render();if(r.msg)toast(r.msg);return r};
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#0d131b;border:1px solid var(--ac);padding:10px 16px;border-radius:10px;z-index:50';document.body.append(d);setTimeout(()=>d.remove(),2600)}
const me=()=>G.T[G.me],tier=o=>o>=90?'sp':o>=80?'go':o>=70?'pl':'',gd=()=>me().div,DN=['','Primera','Segunda','Tercera','Cuarta','Quinta'];
const season=()=>`${2026+G.season}/${String((27+G.season)%100).padStart(2,'0')}`;
function crest(t,z=40){if(t.gar)return`<img src="escudo.png" height="${z}" style="object-fit:contain;vertical-align:middle">`;const[a,b]=t.c,c=t.cr,id='k'+t.id;
 const sh=['M5 5h50v32q0 14-25 22Q5 51 5 37z','M30 3l25 8v26q0 14-25 22Q5 51 5 37V11z','M5 5h50v30L30 59 5 35z','M8 5h44l4 14v18q0 14-26 22Q4 51 4 37V19z','M30 3a27 27 0 110 54 27 27 0 010-54z'][c.s];
 const pt=[`<rect width="30" height="60" fill="${b}"/>`,`<rect y="22" width="60" height="14" fill="${b}"/>`,`<path d="M0 0h60L0 60z" fill="${b}"/>`,`<rect x="24" width="12" height="60" fill="${b}"/><rect y="24" width="60" height="12" fill="${b}"/>`][c.p];
 return`<svg width="${z}" height="${z}" viewBox="0 0 60 62" style="vertical-align:middle"><clipPath id="${id}"><path d="${sh}"/></clipPath><g clip-path="url(#${id})"><rect width="60" height="62" fill="${a}"/>${pt}</g><path d="${sh}" fill="none" stroke="#fff" stroke-width="2.5"/><text x="30" y="36" text-anchor="middle" font="" font-size="17" font-weight="900" fill="#fff" stroke="#000" stroke-width=".6">${e(c.i)}</text></svg>`}
const shirt=(t,z=40)=>`<svg width="${z}" height="${z}" viewBox="0 0 40 40"><path d="M12 4l-9 6 4 7 4-2v21h18V15l4 2 4-7-9-6q-3 4-8 4t-8-4z" fill="${t.c[0]}" stroke="#fff6"/><path d="M12 4q3 4 8 4t8-4" fill="none" stroke="${t.c[1]}" stroke-width="3"/></svg>`;
const tb=d=>{const m={};G.divs[d].forEach(i=>m[i]={id:i,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0});G.fx[d].filter(f=>f.done).forEach(f=>{const a=m[f.h],b=m[f.a];a.pj++;b.pj++;a.gf+=f.hg;a.gc+=f.ag;b.gf+=f.ag;b.gc+=f.hg;if(f.hg>f.ag){a.g++;b.p++;a.pts+=3}else if(f.hg<f.ag){b.g++;a.p++;b.pts+=3}else{a.e++;b.e++;a.pts++;b.pts++}});return Object.values(m).sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)||y.gf-x.gf||(x.id<y.id?-1:1))};
const mf=()=>G.fx[gd()].filter(f=>f.h===G.me||f.a===G.me).sort((a,b)=>a.r-b.r);
const form=id=>{const d=G.T[id].div;return G.fx[d].filter(f=>f.done&&(f.h===id||f.a===id)).slice(-5).map(f=>{const h=f.h===id,a=h?f.hg:f.ag,b=h?f.ag:f.hg;return a>b?'W':a<b?'L':'D'})};
const fchips=id=>form(id).map(x=>`<span class="${x}"><b>${x==='W'?'V':x==='D'?'E':'D'}</b></span>`).join(' ')||'<span class="mu">—</span>';
const avg=id=>{const t=G.T[id];return Math.round(t.lu.reduce((s,i)=>s+G.P[i].ovr,0)/5)};
function card(p,x={}){const s=p.s;return`<div class="pc ${tier(p.ovr)} ${x.sel?'sel':''}" ${x.attr||''}><div class="r sp"><div><div class="o">${p.ovr}</div><b>${p.pos}</b></div><div style="text-align:center">${shirt(p.t?G.T[p.t]:{c:['#555','#aaa']},34)}<div class="o" style="font-size:16px">#${p.n}</div></div><div style="text-align:right">${G.T[G.me].cap===p.id?'<b>©</b>':''}${p.inj?`<div class="bd">LES ${p.inj}</div>`:''}</div></div><div class="nm">${e(p.name)}</div>
 <div class="a"><span><b>RIT</b> ${p.pace}</span><span><b>TIR</b> ${p.shoot}</span><span><b>PAS</b> ${p.pass}</span><span><b>REG</b> ${p.drib}</span><span><b>DEF</b> ${p.def}</span><span><b>FIS</b> ${p.phys}</span></div>
 <div class="sm" style="margin-top:4px">POT ${p.pot} · forma ${p.form>0?'▲':p.form<0?'▼':'■'}${p.form||''}</div><div class="bar"><i style="width:${100-p.fat}%;background:${p.fat>60?'#ff4d6a':p.fat>30?'#f5c542':'#00e08a'}"></i></div>${x.extra||''}</div>`}
function modal(h){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div>${h}<button class="btn s" style="margin-top:12px;width:100%" onclick="this.closest('.modal').remove()">Cerrar</button></div>`;m.onclick=ev=>{if(ev.target===m)m.remove()};document.body.append(m)}
function report(f,sea){const H=G.T[f.h],A=G.T[f.a],r=f.rep;if(!r)return;const row=(n,a,b)=>`<div class="st"><b>${a}</b><span class="mu">${n}</span><b>${b}</b></div>`,mv=G.P[r.mvp];
 modal(`<div class="r sp" style="justify-content:center">${crest(H,50)}<div class="score">${f.hg} - ${f.ag}</div>${crest(A,50)}</div><div class="mu" style="text-align:center">${e(H.name)} vs ${e(A.name)}</div><h3 style="margin-top:12px">Estadísticas</h3>${row('Posesión',r.pos+'%',100-r.pos+'%')}${row('Tiros',r.sh[0],r.sh[1])}${row('A puerta',r.so[0],r.so[1])}${row('Paradas',r.sv[0],r.sv[1])}${row('Faltas',r.fo[0],r.fo[1])}${row('Amarillas',r.yc[0],r.yc[1])}
 <h3 style="margin-top:12px">Cronología</h3>${r.ev.map(v=>`<div class="sm">${v.m}' ${e(v.x)}</div>`).join('')||'<div class="mu">Sin incidencias</div>'}<h3 style="margin-top:12px">Valoraciones</h3><div>${Object.entries(r.rt).filter(([i])=>G.P[i]&&G.P[i].t===G.me).sort((a,b)=>b[1]-a[1]).map(([i,v])=>`<span class="chip">${e(G.P[i].name)} <b>${v}</b></span>`).join('')}</div><div style="margin-top:8px">⭐ MVP: <b>${e(mv?mv.name:'')}</b></div>
 ${sea?`<h3 style="margin-top:12px">Fin de temporada</h3><div>${e(G.news.find(n=>n.k==='season')?.t||'')}</div>`:''}`)}
const views={
inicio(){const m=mf(),nx=m.find(f=>!f.done),la=[...m].reverse().find(f=>f.done),t=tb(gd()),pos=t.findIndex(x=>x.id===G.me),dsl=me().pl.map(i=>G.P[i]),inj=dsl.filter(p=>p.inj).length,fat=Math.round(dsl.reduce((s,p)=>s+p.fat,0)/8);
 const opp=nx?G.T[nx.h===G.me?nx.a:nx.h]:null;
 return`<div class="g g2"><div class="c" style="grid-column:1/-1;background:linear-gradient(120deg,#0e3a3a,#111a26)"><div class="mu sm">TEMPORADA ${season()} · ${DN[gd()]} División · Jornada ${Math.min(G.round+1,22)}/22</div>
 ${nx?`<div class="r sp" style="justify-content:space-around;margin:14px 0"><div style="text-align:center">${crest(G.T[nx.h],64)}<br><b>${e(G.T[nx.h].name)}</b></div><div style="font:900 28px Impact">VS</div><div style="text-align:center">${crest(G.T[nx.a],64)}<br><b>${e(G.T[nx.a].name)}</b></div></div>
 <div class="mu sm" style="text-align:center">${dt(G.dates[nx.r])} · ${e(G.T[nx.h].st)} · Previa: tu media ${avg(G.me)} vs ${avg(opp.id)} · Rival: ${fchips(opp.id)} · ${t.findIndex(x=>x.id===opp.id)+1}º</div>`:''}
 <button class="btn big" style="margin-top:14px" onclick="adv()">▶ Avanzar jornada</button></div>
 <div class="c"><h3>Último resultado</h3>${la?`<div class="r sp"><span>${e(G.T[la.h].name)}</span><b style="font:900 24px Impact">${la.hg}-${la.ag}</b><span>${e(G.T[la.a].name)}</span></div><div class="r" style="margin-top:8px"><button class="btn s" onclick='watch(G.fx[${gd()}].find(f=>f.r===${la.r}&&(f.h==="${G.me}"||f.a==="${G.me}")))'>▶ Ver partido</button><button class="btn s" onclick='report(G.fx[${gd()}].find(f=>f.r===${la.r}&&(f.h==="${G.me}"||f.a==="${G.me}")))'>Resumen</button></div>`:'<span class="mu">Aún no has jugado</span>'}</div>
 <div class="c"><h3>Objetivo de temporada</h3><b>${e(G.obj.t)}</b><div class="mu sm">Ahora: ${pos+1}º · ${t[pos].pts} pts</div><div class="bar"><i style="width:${Math.min(100,t[pos].pts/66*100)}%"></i></div></div>
 <div class="c"><h3>Presupuesto</h3><div style="font:900 28px Impact">${eur(me().bud)}</div><div class="mu sm">Racha: ${G.streak>0?G.streak+' victorias':G.streak<0?-G.streak+' derrotas':'—'}</div></div>
 <div class="c"><h3>Estado de la plantilla</h3>Lesionados: <b>${inj}</b> · Cansancio medio: <b>${fat}%</b><div class="bar"><i style="width:${100-fat}%"></i></div></div>
 <div class="c"><h3>Clasificación</h3>${mini(t,pos)}</div><div class="c"><h3>Noticias</h3>${G.news.slice(0,8).map(n=>`<div class="nw sm">${{result:'⚽',transfer:'🔁',injury:'🩹',streak:'🔥',season:'🏆'}[n.k]||'📰'} ${e(n.t)}</div>`).join('')}</div></div>`},
plantilla(){const ps=me().pl.map(i=>G.P[i]).sort((a,b)=>b.ovr-a.ovr);return`<h2>Plantilla</h2><div class="mu sm" style="margin-bottom:8px">Posición y dorsal editables; © para capitán.</div><div class="g g4">${ps.map(p=>card(p,{extra:`<div class="r" style="margin-top:6px"><select onchange="setp(${p.id},this.value,null)">${['GK','DEF','MID','FWD'].map(x=>`<option ${x===p.pos?'selected':''}>${x}</option>`).join('')}</select><input type="number" value="${p.n}" min="1" max="99" style="width:54px" onchange="setp(${p.id},null,this.value)"></div><button class="btn s" style="margin-top:6px;width:100%;padding:5px" onclick="cap(${p.id})">© Capitán</button><div class="sm">${eur(p.val)} · ${eur(p.sal)}/j · contrato ${p.ct} temp.</div>`})).join('')}</div>`},
tacticas(){const t=me(),S={'GK':88,'DEF':68,'MID':46,'FWD':22},FM={'1-2-1':[1,2,1],'2-1-1':[2,1,1],'1-1-2':[1,1,2],'2-2':[2,2,0]},f=FM[t.fm],sl=['GK',...Array(f[0]).fill('DEF'),...Array(f[1]).fill('MID'),...Array(f[2]).fill('FWD')],cnt={};sl.forEach(s=>cnt[s]=(cnt[s]||0)+1);const k={};
