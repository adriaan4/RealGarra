<style>
:root{--bg:#0d0b09;--ink:#f6eedb;--gold:#e2ab2c;--red:#a01f22;--card:#1a1512;--line:#3b2e1f}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body{margin:0;overflow-x:hidden;min-height:100vh;color:var(--ink);font:400 17px/1.5 Barlow,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(1200px 500px at 50% -100px,#2a1d0c,var(--bg))}
h1,h2,.big{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:800;margin:0}
h1,h2{color:var(--gold)}
nav{display:flex;gap:6px;align-items:center;padding:10px 18px;border-bottom:3px solid var(--gold);position:sticky;top:0;background:var(--bg);flex-wrap:wrap;z-index:2}
nav img{height:46px;margin-right:8px}
nav a{color:var(--ink);text-decoration:none;font:600 20px "Barlow Condensed",sans-serif;padding:4px 14px;border-radius:99px}
nav a.on{background:var(--gold);color:#0d0b09}
main{max-width:1000px;margin:0 auto;padding:24px 18px 60px}
.home{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start}
@media(max-width:780px){.home{grid-template-columns:1fr}}
.hero{text-align:center;padding:10px 0}
.crest{width:min(260px,60vw);filter:drop-shadow(0 8px 24px rgba(226,171,44,.25))}
.vs{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,26px);flex-wrap:nowrap}
.vs .crest{width:min(150px,32vw)}
.vsTxt{font:800 clamp(20px,5vw,32px) "Barlow Condensed",sans-serif;color:var(--red)}
.crestPrev{height:70px;width:70px;object-fit:contain;background:#0d0b09;border-radius:8px;border:1px solid var(--line)}
.sub{margin:4px 0;opacity:.8;font-size:18px}
.big{font-size:clamp(52px,12vw,110px);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.units{display:flex;justify-content:center;gap:clamp(10px,3vw,28px)}
.units small{display:block;font-size:15px;opacity:.7}
.pend{font-size:clamp(34px,8vw,60px);background:var(--red);color:var(--ink);display:inline-block;padding:6px 22px;border:3px solid var(--gold);transform:rotate(-2deg)}
.salon{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:12px;padding:16px}
.hit{border-left:4px solid var(--red);padding:6px 0 6px 12px;margin-top:12px}
.hit small{display:block;opacity:.7}.hit b{font:800 24px "Barlow Condensed",sans-serif;color:var(--gold)}.hit span{display:block;font-size:14px;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.p{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.cands{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.pbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:14px 0}
.pbtn{font:800 clamp(20px,5vw,28px) "Barlow Condensed",sans-serif;padding:14px 8px;border-radius:10px;border:2px solid var(--gold);background:var(--card);color:var(--gold);text-transform:uppercase;overflow-wrap:anywhere;line-height:1.1}
.pbtn:hover{background:var(--gold);color:#0d0b09}
.cand{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:space-between;min-width:0}
.cand b{font:800 clamp(18px,4.8vw,30px) "Barlow Condensed",sans-serif;color:var(--gold);overflow-wrap:anywhere;line-height:1.1}
.cand button{width:100%;padding:6px 4px}
.cand.sel{border-color:var(--gold);background:#2a1d0c}
.tag{background:var(--gold);color:#0d0b09;font:800 15px "Barlow Condensed",sans-serif;padding:2px 10px;border-radius:99px}
.pv{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:12px 14px;margin-top:10px}
.vh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.banner{background:var(--red);border:3px solid var(--gold);border-radius:12px;padding:14px 18px;margin:14px 0}
.banner b{font:800 34px "Barlow Condensed",sans-serif;display:block}
button,input{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{cursor:pointer;background:var(--gold);color:#0d0b09;font-weight:500;border-color:var(--gold)}
button.mine{background:var(--red);color:var(--ink)}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar{height:8px;background:var(--line);border-radius:4px;margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.msg{min-height:24px;font-weight:500;color:var(--gold)}
ol.rank{padding-left:22px}
dialog{background:var(--card);color:var(--ink);border:3px solid var(--gold);border-radius:14px;text-align:center;padding:24px 34px}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog b{display:block;font:800 clamp(36px,9vw,64px) "Barlow Condensed",sans-serif;color:var(--gold)}
.spons{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:18px}
a.spon{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:12px;padding:16px;color:var(--ink);text-decoration:none;transition:transform .15s,border-color .15s}
a.spon:hover{border-color:var(--gold);transform:translateY(-3px)}
a.spon .logo{height:280px;display:flex;align-items:center;justify-content:center;background:#0d0b09;border-radius:10px;overflow:hidden}
a.spon .logo img{max-width:100%;max-height:100%;object-fit:contain}
a.spon .web{font:800 22px "Barlow Condensed",sans-serif;color:var(--gold);text-align:center;overflow-wrap:anywhere}
a.spon p{margin:0;opacity:.85;font-size:16px}
.step{display:flex;gap:6px;align-items:center}.step button{width:42px;padding:8px 0;font-size:20px;line-height:1}
.step input{width:64px;text-align:center;padding:8px 4px}
.tw{overflow-x:auto;margin-top:16px}
table.cal{width:100%;border-collapse:collapse;min-width:560px}
.cal th{font:800 18px "Barlow Condensed",sans-serif;color:var(--gold);text-align:left;padding:8px 10px;border-bottom:3px solid var(--gold);white-space:nowrap}
.cal td{padding:9px 10px;border-bottom:1px solid var(--line)}
.cal td:first-child{font:800 22px "Barlow Condensed",sans-serif;color:var(--gold)}
.cal tr.next td{background:#2a1d0c}
.cal tr.next td:first-child{border-left:4px solid var(--red)}
.cal .tbc{opacity:.55}
table.clt{width:100%;border-collapse:collapse;min-width:560px}
.clt th{font:800 18px "Barlow Condensed",sans-serif;color:var(--gold);text-align:left;padding:8px 10px;border-bottom:3px solid var(--gold);white-space:nowrap}
.clt td{padding:9px 10px;border-bottom:1px solid var(--line)}
.clt td:first-child{font:800 22px "Barlow Condensed",sans-serif;color:var(--gold)}
.clt td.cp{font-weight:700;color:var(--gold)}
.clt tr.next td{background:#2a1d0c}
.clt tr.next td:first-child{border-left:4px solid var(--red)}
@media(max-width:640px){
 table.clt{min-width:0;font-size:15px}
 .clt th{font-size:15px;padding:6px 2px;text-align:center}
 .clt th:nth-child(2){text-align:left;padding-left:4px}
 .clt td{padding:9px 2px;text-align:center}
 .clt td:first-child{font-size:19px;width:26px;padding-left:4px}
 .clt tr.next td:first-child{border-left-width:3px}
 .clt td.cn{text-align:left;padding-left:4px;line-height:1.15;font-weight:600}
 .clt td.cn img.mini{height:18px;width:18px;margin-right:4px}
}
@media(max-width:400px){.clt .cgf,.clt .cgc{display:none}table.clt{font-size:14px}}
.calA{display:grid;grid-template-columns:110px 1fr 130px auto;gap:8px;align-items:center;margin-top:8px}
@media(max-width:600px){.calA{grid-template-columns:1fr 1fr}}

#splash{position:fixed;inset:0;z-index:99;background:radial-gradient(700px 500px at 50% 40%,#2a1d0c,#0d0b09 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
.nosplash #splash{display:none}
#splash img{width:min(240px,56vw);filter:drop-shadow(0 10px 34px rgba(226,171,44,.4));animation:spIn .9s cubic-bezier(.2,.9,.3,1.2) both}
#splash b{font:800 clamp(26px,8vw,40px) "Barlow Condensed",Impact,sans-serif;letter-spacing:3px;color:var(--gold);animation:spUp .7s .35s both}
#splash i{display:block;width:120px;height:4px;border-radius:4px;background:var(--line);overflow:hidden;animation:spUp .7s .5s both}
#splash i::after{content:"";display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:4px;animation:spBar 1.1s ease-in-out infinite}
@keyframes spIn{from{opacity:0;transform:scale(.6) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spBar{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
@media(prefers-reduced-motion:reduce){#splash img,#splash b,#splash i,#splash i::after{animation:none}}
nav{padding-top:calc(10px + env(safe-area-inset-top,0px))}
main{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
.podio{display:grid;gap:6px;margin:8px 0}.podio div{display:flex;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.juegan{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:10px 14px;margin:10px 0}.juegan b{color:var(--gold)}
.pchk{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}.pchk input{width:auto;min-height:0;margin:0}
.crestGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.crestCard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.crestCard b{font:800 20px "Barlow Condensed",sans-serif;color:var(--gold);overflow-wrap:anywhere;line-height:1.1}
.crestImg{width:90px;height:90px;display:flex;align-items:center;justify-content:center;background:#0d0b09;border-radius:8px;border:1px solid var(--line);overflow:hidden}
.crestImg img{max-width:100%;max-height:100%;object-fit:contain}
.crestImg span{font-size:12px;opacity:.6}
.crestCard .row{justify-content:center;margin:0}
.crestPickBtn{background:none;border:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;width:100%;cursor:pointer}
.crestCard button.ghost{font-size:13px;padding:4px 8px}
#crestDlg{width:min(620px,94vw);max-height:88vh;overflow:auto}
img.mini{height:22px;width:22px;object-fit:contain;vertical-align:middle;margin-right:6px}
[hidden]{display:none}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .5s}}
/* ===== Móvil: sin saltos, controles grandes, nada se sale de la pantalla ===== */
img{max-width:100%}
button,a,input,summary,select{touch-action:manipulation}
input{min-width:0;max-width:100%}
input[type=datetime-local],input[type=time],input[type=number]{-webkit-appearance:none;appearance:none;min-height:44px}
input[type=number]{-moz-appearance:textfield}
button{min-height:44px}
nav{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;gap:4px;padding-left:12px;padding-right:12px;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav img{height:38px;flex:none;margin-right:4px}
nav a{flex:none;white-space:nowrap;font-size:19px;padding:6px 13px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:200;max-width:520px;margin:0 auto;background:var(--ink);color:#0d0b09;font-weight:500;border-radius:12px;padding:12px 16px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.55);pointer-events:none}
.toast:empty{display:none}
details.ad{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:12px;margin:12px 0;overflow:hidden}
details.ad>summary{list-style:none;cursor:pointer;padding:12px 16px;min-height:54px;font:800 24px "Barlow Condensed",Impact,sans-serif;color:var(--gold);display:flex;justify-content:space-between;align-items:center;gap:10px}
details.ad>summary::-webkit-details-marker{display:none}
details.ad>summary::after{content:"▾";font-size:20px;transition:transform .2s}
details.ad[open]>summary::after{transform:rotate(180deg)}
details.ad>summary:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
/* Crónicas y ranking */
.cron{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:12px;overflow:hidden;margin:0 0 20px}
.cron .chd{display:flex;gap:14px;align-items:flex-start;padding:14px 16px 0}
.cron .ctx{min-width:0;flex:1}
.cron .cph{flex:none;width:clamp(92px,26vw,150px);padding:0;margin:0;background:#0d0b09;border:2px solid var(--gold);border-radius:10px;overflow:hidden;cursor:zoom-in;line-height:0;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.cron .cph img{display:block;width:100%;height:auto;max-height:200px;object-fit:contain}
.cron .cph::after{content:"🔍";position:absolute;right:4px;bottom:4px;font-size:13px;line-height:1;background:rgba(13,11,9,.75);border-radius:6px;padding:3px 4px}
#cronZoom{width:min(94vw,560px);padding:12px}

#cronZoom button{margin-top:10px}
.cron .cbd{padding:10px 16px 16px}
.cron small{color:var(--gold);letter-spacing:1px;text-transform:uppercase;font-weight:700}
.cron h3{margin:2px 0 2px;font:800 clamp(24px,6vw,30px)/1.1 "Barlow Condensed",Impact,sans-serif;text-transform:uppercase}
.cron h3 .cres{color:var(--gold);white-space:nowrap}
.cron h4{margin:6px 0 0;font:700 20px/1.2 "Barlow Condensed",sans-serif;color:var(--gold)}
.cron p{margin:0;white-space:pre-line;overflow-wrap:anywhere;line-height:1.5}
.cron.mini .cph{width:clamp(76px,21vw,110px)}

#cronHome{margin-top:26px}
#cronHome>h2{margin:0 0 10px}
textarea.cnT{width:100%;min-height:150px;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical;margin-top:8px}
#cnTitle{width:100%;margin-top:8px}
#cnPh{max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--line);display:block}
.gbr{list-style:none;margin:0;padding:0}
.gbr li{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.gbr li.me{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.gbr .pos{font:800 26px "Barlow Condensed",sans-serif;text-align:center;color:var(--gold)}
.gbr .nm{font:800 22px/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase;overflow-wrap:anywhere}
.gbr .nm small{display:block;font:600 15px "Barlow Condensed",sans-serif;opacity:.85;text-transform:none}
.gbr .pv2{font:800 26px "Barlow Condensed",sans-serif;color:var(--gold);text-align:right;line-height:1}
.gbr .pv2 small{display:block;font-size:13px;opacity:.8}
.atabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 14px}

.ecoAll b{display:block;font-size:18px}.ecoAll small{display:block}
.atab{padding:8px 6px;min-height:44px;font:800 18px "Barlow Condensed",Impact,sans-serif;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;text-align:center;line-height:1.1}
